<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a">
        <animate attributeName="stop-color" values="#0f172a;#1e1b4b;#0f172a" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#1e293b">
        <animate attributeName="stop-color" values="#1e293b;#312e81;#1e293b" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0284c7">
        <animate attributeName="stop-color" values="#0284c7;#4f46e5;#0284c7" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Grid / Wave Lines -->
  <path d="M0 220 Q 300 160 600 220 T 1200 220" fill="none" stroke="rgba(56, 189, 248, 0.15)" stroke-width="2">
    <animate attributeName="d" values="M0 220 Q 300 160 600 220 T 1200 220; M0 220 Q 300 260 600 220 T 1200 220; M0 220 Q 300 160 600 220 T 1200 220" dur="6s" repeatCount="indefinite" />
  </path>
  <path d="M0 250 Q 300 290 600 240 T 1200 250" fill="none" stroke="rgba(129, 140, 248, 0.2)" stroke-width="2">
    <animate attributeName="d" values="M0 250 Q 300 290 600 240 T 1200 250; M0 250 Q 300 200 600 250 T 1200 250; M0 250 Q 300 290 600 240 T 1200 250" dur="7s" repeatCount="indefinite" />
  </path>

  <!-- Animated Survey Icon Graphic -->
  <g transform="translate(140, 70)">
    <!-- Clipboard Card -->
    <rect x="0" y="20" width="130" height="160" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="3" filter="url(#glow)" />
    <!-- Clip Top -->
    <rect x="40" y="8" width="50" height="24" rx="6" fill="#38bdf8" />
    
    <!-- Survey Progress / Check Lines -->
    <line x1="25" y1="60" x2="105" y2="60" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
    <line x1="25" y1="90" x2="85" y2="90" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
    <line x1="25" y1="120" x2="95" y2="120" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
    <line x1="25" y1="150" x2="65" y2="150" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />

    <!-- Animated Checkmarks -->
    <circle cx="105" cy="90" r="10" fill="#34d399">
      <animate attributeName="r" values="8;12;8" dur="2s" repeatCount="indefinite" />
    </circle>
    <path d="M100 90 L104 94 L110 86" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

    <circle cx="95" cy="150" r="10" fill="#38bdf8">
      <animate attributeName="r" values="10;7;10" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <path d="M90 150 L94 154 L100 146" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Main Title & Subtitle -->
  <g transform="translate(320, 135)">
    <text x="0" y="0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="800" fill="url(#textGrad)" letter-spacing="1">Awesome Survey</text>
    <text x="0" y="45" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#94a3b8">Curated Experience Management &amp; Survey Software Landscape</text>
    
    <!-- Dynamic Glowing Pulse Pill -->
    <g transform="translate(0, 75)">
      <rect x="0" y="0" width="340" height="34" rx="17" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" />
      <circle cx="20" cy="17" r="5" fill="#34d399">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite" />
      </circle>
      <text x="36" y="23" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#38bdf8">Open-Source &amp; Commercial Solutions</text>
    </g>
  </g>
</svg>
